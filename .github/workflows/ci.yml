name: CI

on:
  push:
  pull_request:

jobs:
  bash-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: bash -n gentoo_installer.sh

      - name: Smoke (--help)
        run: bash gentoo_installer.sh --help | grep -q Usage

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck gentoo_installer.sh
